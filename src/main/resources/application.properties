spring.application.name=springedumanager_2
spring.mvc.hiddenmethod.filter.enabled=true

# =====================================================
# MYSQL
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springedumanager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# =====================================================
# JPA / HIBERNATE
# =====================================================

# Permite que Hibernate cree o actualice
# la estructura de las tablas.
spring.jpa.hibernate.ddl-auto=update


# Permite visualizar SQL generado por Hibernate.
spring.jpa.show-sql=true


# Formatea las consultas mostradas en consola.
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# SPRING SECURITY - USUARIOS
# =====================================================
#
# Usuarios en memoria para autenticacion.
#
# admin: puede crear/editar/eliminar cursos.
# usuario: solo puede navegar y consultar la informacion.
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.user.username=usuario
app.security.user.password=user123